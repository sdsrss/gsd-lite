name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        # This IS the coverage gate: test:coverage runs c8 with
        # `--check-coverage --lines 80 --branches 75`, so a drop fails here.
        #
        # A separate "Check coverage threshold" step used to follow, shelling out
        # to `c8 report`. node_modules/.bin is not on PATH inside `run:`, so the
        # command was never found, COVERAGE came back empty, and the step printed
        # "Could not parse coverage, skipping threshold check" and exited 0 on
        # every build it ever ran. A step that cannot fail is worse than no step:
        # it reads like a gate in the job list and in review.
        run: npm run test:coverage

      - name: Security audit
        # R-16: gate on high+ only so unrelated low/moderate advisories don't block
        # unrelated hotfixes. The transitive `hono` advisories (serve-static path
        # traversal, CORS, AWS Lambda / Lambda@Edge adapters, body-limit) target
        # HTTP-server / serverless features that a stdio-only MCP server never
        # invokes — they are unreachable here. `overrides.hono` still pins hono to a
        # patched version, so this currently reports 0 vulnerabilities.
        run: npm audit --omit=dev --audit-level=high
