name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing in this workflow writes to the repository: it checks out, installs,
# lints and tests. Stating `contents: read` means the job's GITHUB_TOKEN cannot
# push, tag or release even if a step (or a dependency of a step) tries to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the engines floor; 24 is the current LTS. Both ends are tested
        # because the failures that matter here are version-dependent — see the
        # coverage steps below for one the matrix itself has to work around.
        node-version: [20, 22, 24]
    steps:
      # Actions are pinned to the commit SHA of the major they track, not to the
      # floating tag. A floating tag is mutable by the action's owner, so `@v5`
      # is a promise rather than a fact; the SHA is the fact. The trailing
      # comment records which major the SHA belongs to, so bumping stays legible.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # tests/gate-replay-changed.test.js pins the vacuity gate's
          # classification against real commits in this repository's history
          # (71271dd, 406fd3a, 331dcda, 14e64fa), because the two bugs found in
          # that rule were about real commit shapes. The default depth-1 clone
          # does not have them, and the tests fail rather than skip on purpose:
          # in CI a missing commit means this line was lost, which would silently
          # disable them.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests (Node 20 — no coverage thresholds available)
        # `--test-coverage-lines` / `--test-coverage-branches` landed in Node
        # 22.8. On 20 they are unknown options and node exits before running a
        # single test, so this leg runs the suite without the coverage gate.
        # It still proves the engines floor works; the gate lives on 22 and 24.
        if: matrix.node-version == 20
        run: npm test

      - name: Run tests with coverage (Node 22+)
        # This IS the coverage gate: test:coverage runs node's built-in coverage
        # with `--test-coverage-lines=80 --test-coverage-branches=75`, so a drop
        # fails here. Verified to be capable of failing: raising the thresholds
        # to 99 exits 1.
        #
        # A separate "Check coverage threshold" step used to follow, shelling out
        # to `c8 report`. node_modules/.bin is not on PATH inside `run:`, so the
        # command was never found, COVERAGE came back empty, and the step printed
        # "Could not parse coverage, skipping threshold check" and exited 0 on
        # every build it ever ran. A step that cannot fail is worse than no step:
        # it reads like a gate in the job list and in review.
        if: matrix.node-version != 20
        run: npm run test:coverage

      - name: Security audit
        # R-16: gate on high+ only so unrelated low/moderate advisories don't block
        # unrelated hotfixes. The transitive `hono` advisories (serve-static path
        # traversal, CORS, AWS Lambda / Lambda@Edge adapters, body-limit) target
        # HTTP-server / serverless features that a stdio-only MCP server never
        # invokes — they are unreachable here. `overrides.hono` still pins hono to a
        # patched version, so this currently reports 0 vulnerabilities.
        run: npm audit --omit=dev --audit-level=high

  gate-replay:
    # A test added alongside a fix is worth its line count only if it was RED on
    # the tree before the fix. Three times in this repo a gate was written that
    # was green on the tree it named — `/等|举例不是穷举/` is the clearest, an
    # ordinary character every prompt already contained, so the assertion could
    # not fail and the defect it named shipped underneath it. scripts/gate-replay.js
    # answers that question, and until now nothing ran it: it was a check you had
    # to remember, which is the same class of defect one layer up.
    #
    # Its own job rather than a step in the matrix above: the question does not
    # depend on the Node version, and asking it three times would say the same
    # thing three times.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The replay checks the BASE tree out into a detached worktree, so the
          # default depth-1 clone cannot answer the question at all — it would
          # take the `GATE NOT RUN` branch on every single run.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      # node_modules is symlinked into the base worktree by gate-replay.js, so
      # the install has to happen before the replay, not alongside it.
      - name: Install dependencies
        run: npm ci

      - name: Replay changed test files against the tree they were written to change
        # VACUOUS fails this job; INCONCLUSIVE is printed and does not. The
        # reasoning is in scripts/gate-replay-changed.sh: a test importing a
        # helper its own commit added is INCONCLUSIVE by construction, which is
        # ordinary work, and a check that fires on ordinary work is one people
        # learn to click through. Verified capable of failing by replaying
        # 71271dd — the vacuous gate named above — which exits 1 here.
        env:
          # push: the branch tip before this push (all-zeros when the push
          # created the ref — the script says so and stops).
          # pull_request: the base branch tip. `HEAD` is the merge commit the
          # checkout produced, so the diff is exactly this PR's test changes.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/gate-replay-changed.sh "$BASE" HEAD
