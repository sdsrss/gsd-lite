name: Release

on:
  push:
    tags: ['v*']

# Default for every job: read only. `validate` needs nothing more, and it runs
# first, so the write grant does not exist while untrusted-ish work (npm ci,
# lifecycle scripts of the whole dependency tree) is running. Only `publish`
# raises it, and only to what it actually uses — see its `permissions:` block.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit SHA of the major, not the floating tag: `@v5` is
      # mutable by the action's owner, the SHA is not. The trailing comment
      # records the major so a bump stays readable in review.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # This job runs the suite, and tests/gate-replay-changed.test.js pins
          # the vacuity gate against real commits in this repository's history.
          # The default depth-1 clone does not have them. ci.yml got this line
          # one commit earlier and release.yml did not, which failed the v0.15.0
          # tag before it could publish — the same call-site patching this
          # release is otherwise about. tests/repo-gates.test.js now fails on any
          # workflow job that runs the suite without it.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Security audit
        # R-16: gate on high+ only (see ci.yml for rationale). Transitive `hono`
        # HTTP/serverless advisories are unreachable in a stdio-only MCP server;
        # `overrides.hono` pins a patched version, so this reports 0 vulnerabilities.
        run: npm audit --omit=dev --audit-level=high

      - name: Verify version consistency
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          MARKET_VERSION=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")

          echo "Tag: $VERSION | package.json: $PKG_VERSION | plugin.json: $PLUGIN_VERSION | marketplace.json: $MARKET_VERSION"

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::plugin.json version ($PLUGIN_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$MARKET_VERSION" ]; then
            echo "::error::marketplace.json version ($MARKET_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
          echo "All versions consistent: $VERSION"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is required by action-gh-release below, which creates
      # or updates the GitHub Release. Do not remove it to "tighten" this job:
      # `npm publish` runs BEFORE the release step, so a job that cannot write
      # the Release still publishes to npm first — leaving the version on npm
      # with no signed Release behind it, which is exactly the state auto-update
      # clients fail closed on (they read GitHub Releases, not npm).
      contents: write
      # `id-token: write` is what `npm publish --provenance` needs: npm exchanges
      # this job's OIDC token for a Sigstore signature binding the tarball to
      # this workflow, this repo and this commit.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Preflight — signing key present before any publish
        # R-11b: fail fast and with a clear message when the secret is simply
        # missing. This is a convenience, not the gate — the real assertion is
        # "Verify signature against the embedded public key" below, and publish
        # now runs after it. An empty NPM_TOKEN secret has bitten this release
        # before, so cheap checks that name the missing secret earn their place.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set — refusing to publish an unsignable release"
            exit 1
          fi
          echo "Signing key present"

      - name: Pack deterministic tarball + compute SHA-256
        id: pack
        # R-11: `npm pack` writes gsd-lite-<version>.tgz; this SAME file is attached
        # as the GitHub Release asset and hashed here, so the `sha256:` in the body
        # is guaranteed to be the hash of the exact bytes the client downloads
        # (asset == hashed file). Unlike GitHub's source tarball_url, whose bytes
        # carry no stable-checksum guarantee, this asset is fixed at publish time.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="gsd-lite-${VERSION}.tgz"
          npm pack
          test -f "$TARBALL" || { echo "::error::expected $TARBALL from npm pack"; exit 1; }
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL — sha256=$SHA"

      - name: Sign the checksum (Ed25519)
        id: sign
        # R-11b: sign the SHA-256 with the private key held only in the
        # RELEASE_SIGNING_KEY secret. The auto-update client verifies this against
        # its embedded public key — tamper-proofing, not just corruption detection.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set — cannot sign release"
            exit 1
          fi
          SIG=$(node -e '
            const crypto = require("crypto");
            const key = crypto.createPrivateKey(process.env.RELEASE_SIGNING_KEY);
            const sig = crypto.sign(null, Buffer.from(process.env.SHA, "utf8"), key);
            process.stdout.write(sig.toString("base64"));
          ')
          test -n "$SIG" || { echo "::error::signing produced an empty signature"; exit 1; }
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"
          echo "Signed checksum (Ed25519)"

      - name: Verify signature against the embedded public key
        # R-11b: assert the RELEASE_PUBLIC_KEY committed in the client actually
        # pairs with the RELEASE_SIGNING_KEY secret, by running the exact client
        # verification path (verifyReleaseSignature, default embedded key). If they
        # ever diverge (wrong key pasted, secret rotated without updating the
        # embedded PEM), every real update at/after MIN_SIGNED_VERSION would fail
        # closed and auto-update would silently stop — this is the ONLY place that
        # key relationship can be asserted. Fail the release before it ships.
        env:
          SHA: ${{ steps.pack.outputs.sha256 }}
          SIG: ${{ steps.sign.outputs.sig }}
        run: |
          node -e '
            const m = require("./hooks/gsd-auto-update.cjs");
            if (!m.verifyReleaseSignature(process.env.SHA, process.env.SIG)) {
              console.error("::error::Signature does not verify against the embedded RELEASE_PUBLIC_KEY — the signing secret and the committed public key have diverged. Clients would fail closed; fix the embedded key (or the secret) before releasing.");
              process.exit(1);
            }
            console.log("Embedded public key pairs with the signing secret ✓");
          '

      - name: Publish to npm (skip if version already exists)
        # Deliberately the LAST irreversible step. This used to run before pack,
        # sign and verify, so a signing secret that no longer paired with the
        # embedded RELEASE_PUBLIC_KEY produced: npm permanently holding the new
        # version, the job then failing at the verify step, no signed GitHub
        # Release, and every auto-update client — which reads GitHub Releases,
        # not npm — failing closed and never seeing the update again. The
        # preflight above only proved the secret was non-empty, which is not the
        # property that matters.
        #
        # The packed tarball is published rather than the working directory, so
        # the bytes on npm are the same bytes hashed into the release body and
        # attached as the asset.
        #
        # `--provenance` adds npm's own attestation on top of the Ed25519
        # signature above. They answer different questions and neither replaces
        # the other: the signature proves the release body's checksum came from
        # the holder of RELEASE_SIGNING_KEY, and is what the auto-update client
        # checks; provenance proves to *npm consumers* that this tarball was
        # built by this workflow from this commit. It needs `id-token: write`
        # (granted on this job) and `--access public` (already passed). If the
        # OIDC exchange fails the publish fails with it, which is the safe
        # direction: nothing reaches npm and the run is re-runnable.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view gsd-lite@$VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "::notice::gsd-lite@$VERSION already published to npm — skipping"
          else
            npm publish "$TARBALL" --access public --provenance
            echo "Published gsd-lite@$VERSION to npm"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          # If a release was already created (e.g., via `gh release create`),
          # this updates it with auto-generated notes appended.
          # If no release exists, it creates one from scratch.
          make_latest: true
          # R-11: attach the deterministic tarball as a release asset and publish
          # its SHA-256 in the body. The auto-update client prefers this asset over
          # the source tarball and enforces `sha256:` before running install.js.
          # R-11b: `sig:` is the Ed25519 signature over the checksum, verified by
          # the client against its embedded public key before install.
          files: ${{ steps.pack.outputs.tarball }}
          append_body: true
          body: |

            ---
            **Integrity** — SHA-256 of the attached `${{ steps.pack.outputs.tarball }}` (auto-update verifies checksum + signature before install):

            sha256: ${{ steps.pack.outputs.sha256 }}
            sig: ${{ steps.sign.outputs.sig }}
